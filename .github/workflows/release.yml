name: Release

# Cuts a GitHub Release with the built fat JAR whenever a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build JAR & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build fat JAR (with tests)
        run: ./gradlew --no-daemon clean check shadowJar

      - name: Generate checksums
        run: cd build/libs && sha256sum *.jar > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Revolt MCP Server ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true   # beta releases until a public 1.0
          files: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
